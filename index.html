<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKI STORE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔥 JOKI STORE 🔥</h1>
        <p>G10 STORE OFFICIAL</p>
    </div>

    <div class="card">
        <h2>📝 TEMPAHAN JOKI</h2>

        <form id="tempahanForm"
              action="https://formspree.io/f/xkjnqlak"
              method="POST">

            <label for="nama">Nama</label>
            <input type="text"
                   id="nama"
                   name="nama"
                   placeholder="Masukkan nama anda"
                   required>

            <label for="gameid">ID Game</label>
            <input type="text"
                   id="gameid"
                   name="gameid"
                   placeholder="Masukkan ID Game"
                   required>


            <!-- ========================= -->
            <!-- RANK PERMULAAN -->
            <!-- ========================= -->

            <h3>🟢 RANK PERMULAAN</h3>

            <label for="rankMula">Pilih Rank</label>

            <select id="rankMula"
                    name="rank_mula"
                    onchange="kemaskiniBintangMula()"
                    required>

                <option value="">-- Pilih Rank Permulaan --</option>

                <optgroup label="EPIC">
                    <option value="Epic V">Epic V</option>
                    <option value="Epic IV">Epic IV</option>
                    <option value="Epic III">Epic III</option>
                    <option value="Epic II">Epic II</option>
                    <option value="Epic I">Epic I</option>
                </optgroup>

                <optgroup label="LEGEND">
                    <option value="Legend V">Legend V</option>
                    <option value="Legend IV">Legend IV</option>
                    <option value="Legend III">Legend III</option>
                    <option value="Legend II">Legend II</option>
                    <option value="Legend I">Legend I</option>
                </optgroup>

                <option value="Mythic">Mythic</option>
                <option value="Mythic Honor">Mythic Honor</option>
                <option value="Mythic Glory">Mythic Glory</option>
                <option value="Mythic Immortal">Mythic Immortal</option>

            </select>


            <label for="bintangMula">Bintang Permulaan</label>

            <select id="bintangMula"
                    name="bintang_mula"
                    onchange="kiraHarga()"
                    required>

                <option value="">-- Pilih Bintang --</option>

            </select>

            <input type="number"
                   id="bintangMulaImmortal"
                   name="bintang_mula_immortal"
                   min="100"
                   placeholder="Masukkan bintang 100+"
                   oninput="kiraHarga()"
                   style="display:none;">


            <!-- ========================= -->
            <!-- RANK AKHIR -->
            <!-- ========================= -->

            <h3>🔵 RANK AKHIR</h3>

            <label for="rankAkhir">Pilih Rank</label>

            <select id="rankAkhir"
                    name="rank_akhir"
                    onchange="kemaskiniBintangAkhir()"
                    required>

                <option value="">-- Pilih Rank Akhir --</option>

                <optgroup label="EPIC">
                    <option value="Epic V">Epic V</option>
                    <option value="Epic IV">Epic IV</option>
                    <option value="Epic III">Epic III</option>
                    <option value="Epic II">Epic II</option>
                    <option value="Epic I">Epic I</option>
                </optgroup>

                <optgroup label="LEGEND">
                    <option value="Legend V">Legend V</option>
                    <option value="Legend IV">Legend IV</option>
                    <option value="Legend III">Legend III</option>
                    <option value="Legend II">Legend II</option>
                    <option value="Legend I">Legend I</option>
                </optgroup>

                <option value="Mythic">Mythic</option>
                <option value="Mythic Honor">Mythic Honor</option>
                <option value="Mythic Glory">Mythic Glory</option>
                <option value="Mythic Immortal">Mythic Immortal</option>

            </select>


            <label for="bintangAkhir">Bintang Akhir</label>

            <select id="bintangAkhir"
                    name="bintang_akhir"
                    onchange="kiraHarga()"
                    required>

                <option value="">-- Pilih Bintang --</option>

            </select>

            <input type="number"
                   id="bintangAkhirImmortal"
                   name="bintang_akhir_immortal"
                   min="100"
                   placeholder="Masukkan bintang 100+"
                   oninput="kiraHarga()"
                   style="display:none;">


            <!-- DATA UNTUK EMAIL -->

            <input type="hidden"
                   id="jumlahBintangData"
                   name="jumlah_bintang">

            <input type="hidden"
                   id="hargaBintangData"
                   name="harga_per_bintang">

            <input type="hidden"
                   id="jumlahHargaData"
                   name="jumlah_harga">


            <!-- RINGKASAN -->

            <div class="summary">

                <div class="summary-row">
                    <span>Rank Permulaan</span>
                    <strong id="paparRankMula">-</strong>
                </div>

                <div class="summary-row">
                    <span>Rank Akhir</span>
                    <strong id="paparRankAkhir">-</strong>
                </div>

                <div class="summary-row">
                    <span>Jumlah Bintang</span>
                    <strong id="jumlahBintang">0 ⭐</strong>
                </div>

                <div class="summary-row">
                    <span>Harga / Bintang</span>
                    <strong id="hargaBintang">RM0</strong>
                </div>

                <div class="total">
                    <span>JUMLAH HARGA</span>
                    <strong id="jumlahHarga">RM0</strong>
                </div>

            </div>


            <!-- REQUEST ROLE -->

            <label for="role">Request Role</label>

            <select id="role"
                    name="request_role"
                    required>

                <option value="">-- Pilih Role --</option>
                <option value="Jungler">1. Jungler</option>
                <option value="Gold">2. Gold</option>
                <option value="EXP">3. EXP</option>
                <option value="Roam">4. Roam</option>
                <option value="Mid">5. Mid</option>

            </select>


            <!-- REQUEST HERO -->

            <label>Request Hero</label>

            <input type="text"
                   id="hero1"
                   name="request_hero_1"
                   placeholder="Nama Hero 1">

            <input type="text"
                   id="hero2"
                   name="request_hero_2"
                   placeholder="Nama Hero 2">

            <input type="text"
                   id="hero3"
                   name="request_hero_3"
                   placeholder="Nama Hero 3">


            <!-- SUBMIT -->

            <button type="submit" id="submitBtn">
                🚀 SUBMIT TEMPAHAN
            </button>

        </form>

        <div id="mesej"></div>

    </div>


    <div class="footer">
        <p>© 2026 JOKI STORE</p>
        <p>G10 STORE OFFICIAL</p>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
