<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOKI STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🔥 JOKI STORE 🔥</h1>
            <p>G10 STORE OFFICIAL</p>
        </div>

        <div class="card">

            <h2>📝 TEMPAHAN JOKI</h2>

            <label for="nama">Nama</label>
            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama anda"
            >

            <label for="gameid">ID Game</label>
            <input
                type="text"
                id="gameid"
                placeholder="Masukkan ID Game"
            >

            <label for="rank">Pilih Rank</label>
            <select id="rank" onchange="kiraHarga()">
                <option value="">-- Pilih Rank --</option>
                <option value="Epic">Epic - RM2 ⭐</option>
                <option value="Legend">Legend - RM3 ⭐</option>
                <option value="Mythic">Mythic - RM5 ⭐</option>
                <option value="Mythic Honor">Mythic Honor - RM6 ⭐</option>
                <option value="Mythic Glory">Mythic Glory - RM7 ⭐</option>
                <option value="Mythic Immortal">Mythic Immortal - RM8 ⭐</option>
            </select>

            <label for="bintangMula">Bintang Mula</label>
            <input
                type="number"
                id="bintangMula"
                min="0"
                placeholder="Contoh: 10"
                oninput="kiraHarga()"
            >

            <label for="bintangAkhir">Bintang Akhir</label>
            <input
                type="number"
                id="bintangAkhir"
                min="0"
                placeholder="Contoh: 20"
                oninput="kiraHarga()"
            >

            <div class="summary">

                <div class="summary-row">
                    <span>Harga / Bintang</span>
                    <strong id="hargaBintang">RM0</strong>
                </div>

                <div class="summary-row">
                    <span>Jumlah Bintang</span>
                    <strong id="jumlahBintang">0 ⭐</strong>
                </div>

                <div class="total">
                    <span>JUMLAH HARGA</span>
                    <strong id="jumlahHarga">RM0</strong>
                </div>

            </div>

            <button onclick="hantarTempahan()">
                🚀 SUBMIT TEMPAHAN
            </button>

            <div id="mesej"></div>

        </div>

        <div class="footer">
            <p>© 2026 JOKI STORE</p>
            <p>G10 STORE OFFICIAL</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
