<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKI STORE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔥 JOKI STORE 🔥</h1>
        <p>G10 STORE OFFICIAL</p>
    </div>

    <div class="card">
        <h2>📋 TEMPAHAN JOKI</h2>

        <form
            id="tempahanForm"
            action="https://formspree.io/f/xkjnqlak"
            method="POST"
        >

            <!-- NAMA -->
            <label for="nama">Nama</label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama anda"
                required
            >

            <!-- ID GAME -->
            <label for="gameid">ID Game</label>
            <input
                type="text"
                id="gameid"
                name="gameid"
                placeholder="Masukkan ID Game"
                required
            >

            <!-- RANK -->
            <label for="rank">Pilih Rank</label>
            <select
                id="rank"
                name="rank"
                onchange="kiraHarga()"
                required
            >
                <option value="">-- Pilih Rank --</option>
                <option value="Warrior">Warrior</option>
                <option value="Elite">Elite</option>
                <option value="Master">Master</option>
                <option value="Grandmaster">Grandmaster</option>
                <option value="Epic">Epic</option>
                <option value="Legend">Legend</option>
                <option value="Mythic">Mythic</option>
                <option value="Mythical Honor">Mythical Honor</option>
                <option value="Mythical Glory">Mythical Glory</option>
                <option value="Mythical Immortal">Mythical Immortal</option>
            </select>

            <!-- REQUEST ROLE -->
            <label for="role">Request Role</label>
            <select
                id="role"
                name="role"
                required
            >
                <option value="">-- Pilih Role --</option>
                <option value="Jungler">1. Jungler</option>
                <option value="Gold">2. Gold</option>
                <option value="EXP">3. EXP</option>
                <option value="Roam">4. Roam</option>
                <option value="Mid">5. Mid</option>
            </select>

            <!-- REQUEST HERO -->
            <label>Request Hero</label>

            <input
                type="text"
                id="hero1"
                name="hero1"
                placeholder="Nama Hero 1"
            >

            <input
                type="text"
                id="hero2"
                name="hero2"
                placeholder="Nama Hero 2"
            >

            <input
                type="text"
                id="hero3"
                name="hero3"
                placeholder="Nama Hero 3"
            >

            <!-- JUMLAH STAR -->
            <label for="star">Jumlah Star</label>
            <input
                type="number"
                id="star"
                name="star"
                min="1"
                placeholder="Contoh: 10"
                onchange="kiraHarga()"
                required
            >

            <!-- HARGA -->
            <label for="harga">Jumlah Harga</label>
            <input
                type="text"
                id="harga"
                name="harga"
                value="RM 0"
                readonly
            >

            <!-- EMAIL -->
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email anda"
                required
            >

            <!-- SUBMIT -->
            <button type="submit">
                📩 SUBMIT TEMPAHAN
            </button>

        </form>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
