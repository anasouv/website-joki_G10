<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKI STORE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔥 JOKI STORE 🔥</h1>
        <p>G10 STORE OFFICIAL</p>
    </div>

    <div class="card">
        <h2>📝 TEMPAHAN JOKI</h2>

        <form id="tempahanForm"
              action="https://formspree.io/f/xkjnqlak"
              method="POST">

            <label for="nama">Nama</label>
            <input type="text"
                   id="nama"
                   name="nama"
                   placeholder="Masukkan nama anda"
                   required>

            <label for="gameid">ID Game</label>
            <input type="text"
                   id="gameid"
                   name="gameid"
                   placeholder="Masukkan ID Game"
                   required>

            <label for="rank">Pilih Rank</label>
            <select id="rank"
                    name="rank"
                    onchange="kiraHarga()"
                    required>

                <option value="">-- Pilih Rank --</option>
                <option value="Epic">Epic - RM2 ⭐</option>
                <option value="Legend">Legend - RM3 ⭐</option>
                <option value="Mythic">Mythic - RM5 ⭐</option>
                <option value="Mythic Honor">Mythic Honor - RM6 ⭐</option>
                <option value="Mythic Glory">Mythic Glory - RM7 ⭐</option>
                <option value="Mythic Immortal">Mythic Immortal - RM8 ⭐</option>

            </select>

            <label for="bintangMula">Bintang Mula</label>
            <input type="number"
                   id="bintangMula"
                   name="bintang_mula"
                   min="0"
                   placeholder="Contoh: 10"
                   oninput="kiraHarga()"
                   required>

            <label for="bintangAkhir">Bintang Akhir</label>
            <input type="number"
                   id="bintangAkhir"
                   name="bintang_akhir"
                   min="0"
                   placeholder="Contoh: 20"
                   oninput="kiraHarga()"
                   required>


            <!-- REQUEST ROLE -->

            <label for="role">Request Role</label>

            <select id="role"
                    name="request_role"
                    required>

                <option value="">-- Pilih Role --</option>
                <option value="Jungler">1. Jungler</option>
                <option value="Gold">2. Gold</option>
                <option value="EXP">3. EXP</option>
                <option value="Roam">4. Roam</option>
                <option value="Mid">5. Mid</option>

            </select>


            <!-- REQUEST HERO -->

            <label>Request Hero</label>

            <input type="text"
                   id="hero1"
                   name="request_hero_1"
                   placeholder="Nama Hero 1">

            <input type="text"
                   id="hero2"
                   name="request_hero_2"
                   placeholder="Nama Hero 2">

            <input type="text"
                   id="hero3"
                   name="request_hero_3"
                   placeholder="Nama Hero 3">


            <!-- DATA HARGA UNTUK EMAIL -->

            <input type="hidden"
                   id="jumlahBintangData"
                   name="jumlah_bintang">

            <input type="hidden"
                   id="hargaBintangData"
                   name="harga_per_bintang">

            <input type="hidden"
                   id="jumlahHargaData"
                   name="jumlah_harga">


            <!-- RINGKASAN -->

            <div class="summary">

                <div class="summary-row">
                    <span>Harga / Bintang</span>
                    <strong id="hargaBintang">RM0</strong>
                </div>

                <div class="summary-row">
                    <span>Jumlah Bintang</span>
                    <strong id="jumlahBintang">0 ⭐</strong>
                </div>

                <div class="total">
                    <span>JUMLAH HARGA</span>
                    <strong id="jumlahHarga">RM0</strong>
                </div>

            </div>


            <!-- SUBMIT -->

            <button type="submit" id="submitBtn">
                🚀 SUBMIT TEMPAHAN
            </button>

        </form>

        <div id="mesej"></div>

    </div>


    <div class="footer">
        <p>© 2026 JOKI STORE</p>
        <p>G10 STORE OFFICIAL</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
